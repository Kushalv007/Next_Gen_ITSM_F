services:
  - type: web
    name: next-gen-itsm
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: cd backend && npx prisma db push && (node dist/prisma/seed.js || true) && node dist/src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: itsm-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: "*"

databases:
  - name: itsm-db
    plan: free
    databaseName: itsm_db
    user: postgres
